<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <mask id="arrow-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <!-- White = visible circle -->
      <circle cx="128" cy="128" r="118" fill="#ffffff"/>
      <!-- Black = cut out (transparent) trend arrow -->
      <polyline
        points="50,185 104,131 137,161 206,86"
        fill="none"
        stroke="#000000"
        stroke-width="22"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <polyline
        points="161,86 206,86 206,131"
        fill="none"
        stroke="#000000"
        stroke-width="22"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </mask>
  </defs>

  <circle cx="128" cy="128" r="118" fill="#9124FF" mask="url(#arrow-cutout)"/>
</svg>
